name: tamapokewear
description: "TamaPoke for Android Wear - A Pokemon Tamagotchi on your wrist"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  wear_plus: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sprites/normal/
    - assets/sprites/shiny/
    - assets/sprites/thumbs/
    - assets/sprites/ui/
    - assets/sounds/
