name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Aciona automaticamente quando você cria uma tag (ex: v1.0.0)
  workflow_dispatch: # Permite rodar o workflow manualmente pelo site do GitHub

jobs:
  build:
    name: Build & Release WearOS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Assets
        run: |
          pip install Pillow
          python tools/download_sprites.py
          python tools/generate_sounds.py

      - name: Build APK (Split per ABI - Debug)
        run: flutter build apk --split-per-abi --debug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
